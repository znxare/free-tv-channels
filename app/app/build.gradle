plugins {
    id 'com.android.application'
}

android {
    namespace 'tv.free.oldtv'
    compileSdk 34

    defaultConfig {
        applicationId 'tv.free.oldtv'
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName '1.1.0'
    }

    // Every build must be signed with the same key as the APK people already have,
    // or Android refuses the update ("App not installed"). Local builds use this PC's
    // ~/.android/debug.keystore; GitHub builds get that same key from the FREETV_KEYSTORE secret.
    def ciKeystore = System.getenv('FREETV_KEYSTORE')
    signingConfigs {
        shared {
            if (ciKeystore) {
                storeFile file(ciKeystore)
                storePassword System.getenv('FREETV_KEYSTORE_PASSWORD') ?: 'android'
                keyAlias System.getenv('FREETV_KEY_ALIAS') ?: 'androiddebugkey'
                keyPassword System.getenv('FREETV_KEY_PASSWORD') ?: 'android'
            }
        }
    }

    buildTypes {
        release {
            // Keep the APK small: strip unused code and resources.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Sideloaded app, so the debug key is fine for signing, as long as it never changes.
            signingConfig ciKeystore ? signingConfigs.shared : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
    }

    // The projector is ARM; no native code ships, but keep packaging lean.
    packagingOptions {
        resources.excludes += ['META-INF/*.kotlin_module', 'META-INF/*.version', 'kotlin/**', 'DebugProbesKt.bin']
    }
}

dependencies {
    def media3 = '1.4.1'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
}
