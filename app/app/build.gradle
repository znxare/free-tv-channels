plugins {
    id 'com.android.application'
}

android {
    namespace 'tv.free.oldtv'
    compileSdk 34

    defaultConfig {
        applicationId 'tv.free.oldtv'
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName '1.0.0'
    }

    buildTypes {
        release {
            // Keep the APK small: strip unused code and resources.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Sideloaded app, so the debug key is fine for signing.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
    }

    // The projector is ARM; no native code ships, but keep packaging lean.
    packagingOptions {
        resources.excludes += ['META-INF/*.kotlin_module', 'META-INF/*.version', 'kotlin/**', 'DebugProbesKt.bin']
    }
}

dependencies {
    def media3 = '1.4.1'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
}
